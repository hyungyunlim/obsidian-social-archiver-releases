name: Release Obsidian Plugin

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Verify release metadata
        run: npm run verify:release -- "${{ steps.version.outputs.tag }}"

      - name: Verify CSS source structure
        run: npm run check:css-source

      - name: Build plugin
        run: npm run build:prod

      - name: Verify build outputs
        run: |
          if [ ! -f dist-plugin/main.js ]; then
            echo "Error: dist-plugin/main.js not found"
            exit 1
          fi
          if [ ! -f manifest.json ]; then
            echo "Error: manifest.json not found"
            exit 1
          fi
          if [ ! -f dist-plugin/styles.css ]; then
            echo "Error: dist-plugin/styles.css not found"
            exit 1
          fi
          echo "All required files are present"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist-plugin/main.js
            dist-plugin/styles.css

      - name: Verify release notes are parseable
        run: node scripts/extract-release-notes.mjs --check

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ steps.version.outputs.tag }}"

          # Body comes from src/release-notes.ts — the same notes the plugin
          # shows in-app — so the two cannot drift and nobody has to remember to
          # paste them in. Releases were previously created with an empty body.
          #
          # A version with no entry is normal: patches without notable changes
          # deliberately have none. Fall back to GitHub's generated notes so the
          # body is never empty.
          if node scripts/extract-release-notes.mjs "$tag" --footer > release-notes.md; then
            echo "Using notes from src/release-notes.ts"
            gh release create "$tag" \
              --title="$tag" \
              --notes-file release-notes.md \
              --draft \
              dist-plugin/main.js manifest.json dist-plugin/styles.css
          else
            echo "No release-notes.ts entry for $tag — falling back to generated notes"
            gh release create "$tag" \
              --title="$tag" \
              --generate-notes \
              --draft \
              dist-plugin/main.js manifest.json dist-plugin/styles.css
          fi
